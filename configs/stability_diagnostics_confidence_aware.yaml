schema_version: 1

# Confidence-conditioned policies deliberately depart from the raw command when
# SLAM confidence degrades. Keep the frozen physical-safety classification and
# hard gates, while reporting raw-command tracking only as a descriptive metric.
classification:
  stance_min_normal_force_n: 50.0
  foot_slip_speed_mps: 0.6
  body_roll_pitch_rad: 0.2617993877991494
  min_base_height_m: 0.45
  consecutive_samples: 2
  coincidence_window_s: 0.1

hard_gate:
  require_zero_terminations: true
  require_zero_truncations: true
  require_finite_samples: true
  require_no_instability_event: true

tracking_gate:
  enabled: false
