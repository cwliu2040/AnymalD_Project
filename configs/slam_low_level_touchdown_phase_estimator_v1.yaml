schema_version: 1
estimator_id: slam-low-level-touchdown-phase-estimator-v1
status: algorithm_and_gates_frozen_before_contact_label_fit
date: 2026-08-24
role: wiring_prerequisite_only_not_teacher_or_adaptation_training
source:
  baseline_root: outputs/slam_low_level_touchdown_headroom_v1_retry2/baseline_envelope
  envelope_path: outputs/slam_low_level_touchdown_headroom_v1_retry2/baseline_envelope/model1450_anti_collapse_envelope.json
  envelope_sha256: c9c987497fe990367388b1308fd1967dbd6ddca4e9d691fc737da81e125aad88
  required_envelope_frozen: true
  expected_run_count: 36
split_by_complete_block:
  train: [585, 586, 587, 588, 589, 590, 591, 592]
  calibration_report_only: [593, 594]
  final_holdout_one_shot: [595, 596]
  profiles_required: [mixed_curve_bounded, pure_yaw_bounded, lateral_translation_bounded]
inputs:
  joint_order_source: frozen_model1450_metadata
  history_offsets_samples_newest_first: [0, 2, 4, 6, 8]
  terms_per_offset: [joint_position, joint_velocity, previous_action]
  previous_action_is_strictly_previous_sample: true
  runtime_forbidden:
    - contact_truth
    - foot_velocity_truth
    - ground_truth
    - command_profile
    - backend_id
    - route_phase
    - future_label
labels_offline_only:
  contact_force_threshold_n: 50.0
  transition_confirmation_samples: 2
  swing_progress_definition: normalized_liftoff_to_next_touchdown
  late_swing_progress_minimum: 0.70
model:
  feature_standardization: train_split_mean_and_population_std
  late_swing_classifier: independent_per_foot_l2_logistic_regression
  logistic_c: 1.0
  logistic_solver: lbfgs
  logistic_max_iterations: 2000
  logistic_class_weight: none
  swing_progress_regressor: independent_per_foot_l2_ridge
  ridge_alpha: 1.0
  runtime_confidence_threshold: 0.80
  output_progress_clip: [0.0, 1.0]
gates_unchanged_after_fit:
  calibration_and_holdout_both_required: true
  aggregate_minimum_late_swing_precision: 0.90
  aggregate_maximum_false_trigger_fraction: 0.01
  aggregate_minimum_late_swing_recall: 0.35
  aggregate_maximum_swing_progress_mae: 0.15
  each_profile_minimum_late_swing_precision: 0.85
  each_profile_minimum_late_swing_recall: 0.20
  all_four_feet_must_have_positive_predictions: true
  holdout_may_tune_model_or_threshold: false
  failed_gate_disposition: stop_phase_estimator_do_not_wire_block_597
boundaries:
  simulator_contact_is_label_only: true
  deployable_history_only: true
  intervention_wiring_authorized: false
  block_597_execution_authorized: false
  teacher_training_authorized: false
  adaptation_training_authorized: false
  ppo_training_authorized: false
  physical_robot_authorized: false
