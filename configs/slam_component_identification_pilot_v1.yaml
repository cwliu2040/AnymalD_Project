schema_version: 1
protocol_id: slam-component-identification-pilot-v1
status: frozen_live_unauthorized
date: 2026-08-24
dataset_role: excluded_component_identification_development
formal_efficacy_use_allowed: false
analysis_script: scripts/validation/analyze_slam_component_identification_pilot.py

question: >-
  Do fresh two-level translation and yaw command interventions provide enough
  independent action and outcome variation to fit a component-conditioned risk
  model while reserving entirely fresh blocks for validation?

experimental_design:
  type: randomized_balanced_repeated_run
  one_robot_sequential_runs: true
  exact_prestate_matching_required: false
  prestate_covariates_reported_not_used_for_exclusion: true
  treatment_assigned_before_run: true
  post_treatment_outcome_based_exclusion_forbidden: true
  primary_inference: identification_dataset_quality_not_efficacy_claim

boundaries:
  actual_slam_backend_required: true
  ros2_bridge_required: true
  model1450_plus_arm_b_frozen: true
  whole_episode_scale_forbidden: true
  synthetic_confidence_schedule_allowed: false
  ground_truth_runtime_input: false
  future_label_runtime_input: false
  policy_training_allowed: false
  ppo_training_allowed: false
  physical_robot_use_authorized: false
  live_execution_authorized: false

common:
  policy: arm_b_model1450_deterministic_supervisor
  velocity_estimator: estimator15
  policy_rate_hz: 50.0
  simulation_steps: 4000
  scene: assets/maps/factory/Factory_Layout.usd
  initial_pose: {x_m: 0.0, y_m: -18.0, yaw_rad: 0.0}
  point_density_profile: gradual_v2
  point_density_min: 0.20
  point_density_timeline_s:
    healthy: 7.25
    ramp_down: 3.0
    low_support_hold: 2.0
    recovery: 2.0
  command_warmup_s: 5.0
  simulator_seed_equals_block_id: true

treatment:
  family: component_specific_single_command_scale_pulse
  design_kind: component_identification_two_level_v1
  untreated_prefix_required: true
  pulse_start_relative_to_profile_s: 7.25
  pulse_duration_s: 0.75
  post_pulse_recovery_required: true
  horizon_s: 0.5
  component_order: [linear_x, linear_y, angular_z]
  arms:
    control: [1.00, 1.00, 1.00]
    uniform_075: [0.75, 0.75, 0.75]
    reduce_translation_075: [0.75, 0.75, 1.00]
    reduce_translation_0875: [0.875, 0.875, 1.00]
    reduce_yaw_075: [1.00, 1.00, 0.75]
    reduce_yaw_0875: [1.00, 1.00, 0.875]
  assignment: deterministic_balanced_cyclic_order_within_backend_profile_block

trace_contract:
  boundary_grace_s: 0.06
  pre_pulse_sample_max_age_s: 0.12
  pre_pulse_max_pairwise_time_skew_s: 0.04
  command_atol: 0.0001
  action_atol: 0.00001
  required_phases: [untreated_prefix, pulse, recovered]
  profile_clock_source: driver_profile_start_clock_s
  pre_pulse_matching_offsets:
    base_linear_velocity: [0, 3]
    base_angular_velocity: [3, 6]
    projected_gravity: [6, 9]
    joint_position: [12, 24]
    joint_velocity: [24, 36]
    previous_action: [36, 48]
    slam_confidence: [48, 51]
  pre_pulse_max_pairwise_linf:
    base_linear_velocity: 0.20
    base_angular_velocity: 0.25
    projected_gravity: 0.08
    joint_position: 0.20
    joint_velocity: 3.25
    previous_action: 0.45
    slam_confidence: 0.20
  pre_pulse_max_pairwise_rms:
    joint_velocity: 1.25
  composite_matching_calibration:
    dataset_role: excluded_wiring_development_pre_treatment_only
    source_attempts: [2, 3, 4]
    backends: [fastlio2, liosam]
    profile: curve_1_5_right_1_0
    block_id: 563
    pairwise_comparisons: 24
    post_pulse_outcomes_used: false
    thresholds_frozen_before_attempt5: true

outcomes:
  primary:
    - pulse_window_intention_to_treat_failure_fraction
    - pulse_window_valid_requested_usable_next_horizon_failure_fraction
  tradeoff:
    - pulse_window_moving_speed_mps
    - pulse_window_normalized_progress
    - pulse_window_stance_weighted_foot_slip_rms_mps
    - pulse_window_roll_pitch_rate_rms_radps
  safety: [fall, base_contact]
  inference_unit: complete_scheduled_live_run
  frame_samples_are_independent_replicates: false
  backends_reported_separately: true

stages:
  wiring_smoke:
    backends: [fastlio2, liosam]
    profiles: [curve_1_5_right_1_0]
    arms: [control, uniform_075, reduce_translation_075, reduce_translation_0875, reduce_yaw_075, reduce_yaw_0875]
    block_ids: [576]
    expected_run_count: 12
    claim_allowed: false
  causal_pilot:
    backends: [fastlio2, liosam]
    profiles: [curve_1_5_right_1_0, curve_1_5_left_1_0]
    arms: [control, uniform_075, reduce_translation_075, reduce_translation_0875, reduce_yaw_075, reduce_yaw_0875]
    block_ids: [577, 578, 579, 580]
    expected_run_count: 96
    claim_allowed: false

frozen_fresh_blocks:
  wiring_smoke: [576]
  causal_pilot: [577, 578, 579, 580]

decision_gate:
  immediate_matrix_stop:
    wiring_or_data_integrity_failure: true
    nonfinite_or_contract_failure: true
    pulse_formula_or_phase_violation: true
  simulation_safety:
    single_fall_or_base_contact_is_retained_not_matrix_stop: true
    repeated_arm_specific_harm_requires_two_blocks_same_backend_profile: true
  component_identification:
    training_dataset_only: true
    no_post_outcome_exclusion: true
    minimum_distinct_targets_per_stratum: 2
    required_arm_count_per_stratum: 24
    required_translation_scales: [0.75, 0.875, 1.0]
    required_yaw_scales: [0.75, 0.875, 1.0]
    reserved_validation_blocks: [581, 582, 583, 584]
  pass_next_step: fit_refrozen_component_model_then_use_reserved_fresh_validation
  otherwise_next_step: stop_before_model_and_redesign_identification
  no_claim_from_identification_data: true

disjointness:
  forbidden_block_ranges:
    - [43, 43]
    - [143, 147]
    - [243, 243]
    - [343, 347]
    - [443, 467]
    - [542, 575]
  reserved_not_collected_in_this_protocol: [581, 582, 583, 584]

implementation_gates:
  pulse_core_complete: true
  benchmark_driver_wiring_complete: true
  trace_and_analysis_complete: true
  artifact_hash_lock_complete: true
  wiring_smoke_authorized: false
  causal_pilot_authorized: false
  action_conditioned_model_training_authorized: false
