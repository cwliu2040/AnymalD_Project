    policy_sha256: 72c9e534a146c27d3ab99d005b042472b73598d1efb4ed7920dbaa772b045a0d
    metadata: exported/anymal_d_locomotion_slam_confidence_publication_v1/arm_d_model48_intent_only/policy_metadata.yaml
