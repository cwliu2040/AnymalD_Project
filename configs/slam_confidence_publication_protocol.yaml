metric_definitions:
  safety:
    fall: any_hard_termination_or_base_height_below_frozen_threshold
    base_contact: base_contact_force_above_zero_and_force_time_integral
    foot_slip_event: stance_force_at_least_50N_and_tangential_speed_at_least_0.6mps_for_two_ticks
    foot_slip_continuous: stance_weighted_tangential_speed_rms_and_integral
    body_tilt: "sqrt(roll^2 + pitch^2), RMS/p95/max"
    roll_pitch_rate: "sqrt(wx^2 + wy^2), RMS/p95/max"
    action_rate: "norm(raw_action[t] - raw_action[t-1]) / dt, RMS/p95"
  efficiency:
    normalized_progress: along_reference_route_progress_divided_by_reference_length
    completion: normalized_progress_at_least_0.95_without_hard_failure
    completion_time: first_time_completion_is_sustained_for_0.5s
    moving_speed: ground_truth_planar_speed_while_requested_speed_at_least_0.25mps
    stopped_fraction: requested_speed_at_least_0.25mps_and_actual_speed_below_0.10mps
    confidence_stop_fraction: requested_speed_at_least_0.25mps_and_safe_scale_below_0.20
    false_stop_fraction: confidence_stop_samples_with_offline_future_usability_label_equal_to_one
    recovery_latency: sustained_confidence_recovery_to_sustained_50pct_requested_speed
  slam:
    tracking_survival: time_to_first_invalid_or_lost_interval_sustained_for_0.25s
    tracking_valid_fraction: valid_duration_divided_by_post_ready_duration
    ate: initial_se2_aligned_translation_rmse
    rpe: translation_and_yaw_error_at_1.0s_delta
    confidence: score_distribution_calibration_id_and_reason_mask
    map_consistency: reference_surface_distance_p50_p95_and_duplicate_surface_fraction
  mechanism:
    - safe_scale
    - intent_blend
    - raw_stride_attenuation
    - applied_stride_attenuation
    - crouch
    - stance_width
    - action_smoothing
    - structured_delta_l2

primary_contrasts:
  - {id: learned_gait_value, treatment: C, control: D, role: confirmatory}
  - {id: learned_total_value, treatment: C, control: B, role: key_secondary}
  - {id: deterministic_supervisor_value, treatment: B, control: A, role: decomposition_control}
  - {id: backend_interaction, factor: backend, contrasts: [C_vs_B, C_vs_D]}

confirmatory_endpoints:
  population: gradual_support_loss_live_runs
  learned_gait_contrast: C_vs_D
  endpoints:
    - stance_weighted_foot_slip_rms_mps
    - while_stable_roll_pitch_rate_rms_radps
    - tracking_restricted_mean_survival_time_s
    - normalized_progress
  evidence_rule:
    mechanism: applied_gait_coordinates_are_nonzero_during_degradation
    safety_direction: C_minus_D_is_below_zero_for_slip_and_roll_pitch_rate
    survival_direction: C_minus_D_is_above_zero_for_tracking_rmst
    efficiency_noninferiority_normalized_progress_difference: -0.10
    uncertainty: report_95pct_intervals_without_post_hoc_threshold_changes

statistics:
  experimental_unit: scheduled_live_run
  scheduled_policy_or_slam_failures_are_retained_as_outcomes: true
  frame_samples_are_independent_replicates: false
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_clusters: [paired_block_id, profile]
  binary_endpoints: paired_risk_difference_with_cluster_bootstrap_interval
  continuous_endpoints: paired_median_and_mean_difference_with_cluster_bootstrap_interval
  survival_endpoint: restricted_mean_survival_time_with_run_level_censoring
  secondary_multiplicity: holm
  report_effect_sizes_even_when_interval_crosses_zero: true
  sample_size_planning:
    input_dataset_role: excluded_pilot
    contrasts:
      - {id: learned_gait, treatment: C, control: D}
      - {id: learned_total, treatment: C, control: B}
    simulation_resamples: 10000
    seed: 20260817
    candidate_paired_block_counts: [5, 6, 8, 10, 12, 15, 20, 25, 30]
    precision_halfwidth_targets:
      stance_weighted_foot_slip_rms_mps: 0.02
      while_stable_roll_pitch_rate_rms_radps: 0.05
      tracking_restricted_mean_survival_time_s: 0.50
      normalized_progress_difference: 0.05
      binary_risk_difference: 0.10
    efficiency_noninferiority_normalized_progress_difference: -0.10
    decision_must_precede_formal_collection: true
    no_post_hoc_target_changes: true
  safety_efficiency_pareto:
    efficiency_value: normalized_progress_per_elapsed_second
    safety_axes:
      - hard_failure_risk
      - stance_weighted_foot_slip_rms_mps
      - while_stable_roll_pitch_rate_rms_radps
    dominated_points_must_be_shown: true

run_disposition:
  infrastructure_failure: rerun_same_block_id_and_retain_failed_attempt_manifest
  policy_or_slam_failure: retain_as_outcome_do_not_rerun_for_replacement
  operator_abort: exclude_only_with_predeclared_safety_or_external_host_reason
  timeout: retain_and_censor_time_to_event_metrics_at_timeout
  efficacy_early_stopping: forbidden
  safety_early_stopping: allowed_and_must_be_reported

