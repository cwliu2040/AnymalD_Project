schema_version: 1
contract_id: liosam-policy-state-v1

runtime:
  mapping_confidence_authority_topic: /slam/odom
  policy_odometry_topic: /slam/policy_odom
  policy_odometry_source_topic: /lio_sam/odometry/imu
  policy_child_frame: base_link
  linear_velocity_frame: base_link
  native_deskew_required: true
  runtime_ground_truth_input: false
  offline_ground_truth_evaluator_only: true

evaluation:
  start_time_s: 1.0
  end_margin_s: 0.5
  nearest_truth_tolerance_s: 0.015
  minimum_matched_samples: 250

gate:
  state_age_s:
    p95_max: 0.15
    absolute_max: 0.20
  source_update_rate_hz_min: 30.0
  timestamp_regression_count_max: 0
  body_linear_velocity_error_mps:
    mean_absolute_max: [0.20, 0.20, 0.15]
    p95_absolute_max: [0.50, 0.50, 0.35]
    absolute_max: [1.50, 1.00, 0.75]
  body_linear_acceleration_mps2:
    p95_absolute_max: [15.0, 15.0, 15.0]
    absolute_max: [50.0, 50.0, 50.0]
  policy_action_counterfactual:
    recorded_action_replay_absolute_max: 0.00001
    active_mean_absolute_max: 0.08
    active_absolute_max: 0.50
    stopped_mean_absolute_max: 0.08
    stopped_absolute_max: 0.40

qualification:
  control_policy: Recovery v0.4.0 model1450
  policy_path: exported/anymal_d_locomotion_v1/recovery_v0.4.0/policy.onnx
  policy_sha256: 721a918533cd00e605cf6edfcd8bf8bba9cbd56f26e22c2eda26604f03ee54c0
  metadata_path: exported/anymal_d_locomotion_v1/recovery_v0.4.0/policy_metadata.yaml
  metadata_sha256: 436ffc022ee6a77526e3fc7f69047bb486bfa4d3de940ba3995879b58f043667
  simulation_steps: 4000
  required_profiles:
    - stationary
    - forward_1_5
    - lateral_1_5
    - lateral_right_1_5
    - backward_1_0
    - curve_1_5_left_1_0
  repetitions_per_profile: 3
  require_locomotion_stability_gate: true
  require_action_sensitivity_gate: true
