[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["logs", "checkpoints", "exported"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["source", "scripts", "tests"]
exclude = ["**/__pycache__", "logs", "checkpoints", "exported"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "none"
