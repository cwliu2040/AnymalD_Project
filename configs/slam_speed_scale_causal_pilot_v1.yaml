schema_version: 1
protocol_id: slam-speed-scale-causal-pilot-v1
status: phase3b_runtime_wiring_hash_locked_live_unauthorized
date: 2026-08-22
dataset_role: excluded_causal_development
formal_efficacy_use_allowed: false

question: >-
  Under matched state, command direction, terrain, friction, support schedule,
  and real ROS 2 SLAM backend, how does an assigned command-speed scale change
  progress and subsequent 0.5 s localization hazard?

boundaries:
  actual_slam_backend_required: true
  ros2_bridge_required: true
  synthetic_confidence_schedule_allowed: false
  ground_truth_runtime_input: false
  future_label_runtime_input: false
  backend_id_runtime_model_input: false
  candidate_scale_runtime_model_input: true
  confidence_estimator_refit_allowed: false
  model1450_frozen: true
  policy_training_allowed: false
  ppo_training_allowed: false
  physical_robot_use_authorized: false
  live_execution_authorized: false

common:
  base_policy: model1450
  velocity_estimator: estimator15
  policy_rate_hz: 50.0
  simulation_steps: 4000
  scene: assets/maps/factory/Factory_Layout.usd
  initial_pose: {x_m: 0.0, y_m: -18.0, yaw_rad: 0.0}
  point_density_profile: gradual_v2
  point_density_min: 0.20
  point_density_timeline_s:
    healthy: 7.0
    ramp_down: 3.0
    low_support_hold: 2.0
    recovery: 2.0
  command_warmup_s: 5.0
  active_healthy_window_s: [5.0, 7.0]
  command_direction_terrain_friction_identical_within_block: true
  simulator_seed_equals_block_id: true

treatment:
  family: fixed_uniform_command_speed_scale
  formula_valid: effective_command_xyz = assigned_scale * requested_command_xyz
  formula_invalid_or_stale: effective_command_xyz = exact_zero
  uniform_xyz_scale_preserves_command_curvature: true
  realized_speed_is_intended_mediator_not_a_confound: true
  arms:
    scale_100: 1.00
    scale_075: 0.75
    scale_050: 0.50
    scale_025: 0.25
  assignment: deterministic_balanced_latin_square_within_backend_profile_block

outcomes:
  horizon_s: 0.5
  primary:
    - valid_requested_usable_next_horizon_failure_fraction
    - tracking_restricted_mean_survival_time_s
  treatment_verification:
    - assigned_command_scale
    - realized_effective_command_scale
    - moving_speed_mps
  tradeoff:
    - normalized_progress
    - normalized_progress_per_elapsed_second
    - stance_weighted_foot_slip_rms_mps
    - while_stable_roll_pitch_rate_rms_radps
  safety: [fall, base_contact]
  inference_unit: complete_scheduled_live_run
  frame_samples_are_independent_replicates: false
  backends_reported_separately: true

stages:
  wiring_smoke:
    backends: [fastlio2, liosam]
    profiles: [curve_1_5_right_1_0]
    arms: [scale_100, scale_075, scale_050, scale_025]
    block_ids: [560]
    expected_run_count: 8
    claim_allowed: false
  causal_pilot:
    backends: [fastlio2, liosam]
    profiles: [curve_1_5_right_1_0, lateral_right_1_5]
    arms: [scale_100, scale_075, scale_050, scale_025]
    block_ids: [561, 562]
    expected_run_count: 32
    claim_allowed: false

decision_gate:
  purpose: unlock_action_conditioned_risk_model_development_only
  immediate_matrix_stop:
    wiring_or_data_integrity_failure: true
    nonfinite_or_contract_failure: true
    assigned_or_realized_scale_violation: true
  simulation_safety:
    single_fall_or_base_contact_is_retained_not_route_fail: true
    repeated_scale_specific_harm_requires_two_blocks_same_backend_profile: true
  model_data_gate_all_required:
    complete_integrity_valid_records: true
    exact_assigned_scale_command_trace: true
    exact_invalid_stale_zero_command: true
    realized_speed_nondecreasing_with_assigned_scale_in_at_least_3_of_4_strata: true
    hazard_nondecreasing_with_assigned_scale_in_at_least_3_of_4_strata: true
    each_backend_has_nonpositive_reduced_scale_minus_full_scale_hazard: true
    no_repeated_reduced_scale_specific_safety_harm: true
  no_claim_from_pilot: true
  pass_next_step: fit_offline_action_conditioned_risk_model_with_blockwise_validation
  otherwise_next_step: stop_before_risk_model_and_redesign_speed_treatment

disjointness:
  forbidden_block_ranges:
    - [43, 43]
    - [143, 147]
    - [243, 243]
    - [343, 347]
    - [443, 467]
    - [542, 559]
  existing_24_action_intervention_role: development_only_not_validation

implementation_gates:
  fixed_scale_runtime_wiring_complete: true
  artifact_hash_lock_complete: true
  wiring_smoke_authorized: false
  causal_pilot_authorized: false
  action_conditioned_model_training_authorized: false
