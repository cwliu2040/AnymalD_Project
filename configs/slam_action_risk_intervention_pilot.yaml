schema_version: 1
protocol_id: slam-action-risk-intervention-pilot-v1
status: frozen_design_artifact_export_passed_smoke_pending
date: 2026-08-21
dataset_role: excluded_causal_development
formal_efficacy_use_allowed: false

question: >-
  Under the same commanded route, simulator state, terrain, friction, LiDAR
  support schedule, and real ROS 2 SLAM backend, does a bounded counterbalanced
  action regime change body motion and subsequent 0.5 s localization hazard?

boundaries:
  actual_slam_backend_required: true
  synthetic_confidence_schedule_allowed: false
  raw_sensor_simulation_allowed: true
  ros2_bridge_required: true
  isaac_python_imports_rclpy: false
  ground_truth_runtime_input: false
  future_label_runtime_input: false
  intervention_id_runtime_policy_input: false
  backend_id_runtime_policy_input: false
  estimator_linear_velocity_required_by_intervention: false
  policy_training_allowed: false
  ppo_training_allowed: false
  model1450_frozen: true
  deterministic_invalid_stale_recovery_fallback: arm_B_exact

common:
  base_policy: arm_B_model1450_deterministic_supervisor
  velocity_estimator: estimator15
  policy_rate_hz: 50.0
  simulation_steps: 4000
  observation_dimension: 51
  scene: assets/maps/factory/Factory_Layout.usd
  initial_pose: {x_m: 0.0, y_m: -18.0, yaw_rad: 0.0}
  point_density_profile: gradual_v2
  point_density_min: 0.20
  point_density_timeline_s:
    healthy: 7.0
    ramp_down: 3.0
    low_support_hold: 2.0
    recovery: 2.0
  command_warmup_s: 5.0
  active_healthy_window_s: [5.0, 7.0]
  command_and_friction_identical_within_block: true
  simulator_seed_equals_block_id: true

intervention:
  family: previous_action_smoothing_direction
  formula: delta_t = clip(alpha * (previous_applied_action - arm_B_action_t), -limit, limit)
  apply_only_while_tracking_valid: true
  invalid_stale_output: exact_arm_B_action
  raw_action_linf_limit: 0.05
  joint_target_linf_limit_rad: 0.025
  arms:
    smooth:
      alpha: 0.10
      expected_mechanism: lower_action_rate
    zero:
      alpha: 0.0
      expected_mechanism: exact_arm_B
    antismooth:
      alpha: -0.10
      expected_mechanism: higher_action_rate
  assignment: deterministic_balanced_latin_square_within_backend_profile_block
  interpretation: controlled_paired_policy_regime_not_runtime_feature

outcomes:
  horizon_s: 0.5
  primary:
    - tracking_restricted_mean_survival_time_s
    - valid_requested_usable_next_horizon_failure_fraction
  required_mechanism:
    - action_rate_rms_per_s
    - while_stable_roll_pitch_rate_rms_radps
  secondary:
    - stance_weighted_foot_slip_rms_mps
    - moving_speed_mps
    - normalized_progress
    - fall
    - base_contact
  inference_unit: complete_scheduled_live_run
  bootstrap_cluster: [block_id, profile]
  frame_samples_are_independent_replicates: false
  realized_speed_is_post_treatment: true
  matched_speed_role: eligibility_and_mechanism_diagnostic_not_randomized_estimand

stages:
  wiring_smoke:
    backends: [fastlio2, liosam]
    profiles: [curve_1_5_right_1_0]
    arms: [smooth, zero, antismooth]
    block_ids: [542]
    expected_run_count: 6
    claim_allowed: false
  pilot:
    backends: [fastlio2, liosam]
    profiles: [curve_1_5_right_1_0, lateral_right_1_5]
    arms: [smooth, zero, antismooth]
    block_ids: [543, 544]
    expected_run_count: 24
    claim_allowed: false
  expanded_only_after_pilot_inconclusive:
    backends: [fastlio2, liosam]
    profiles: [curve_1_5_right_1_0, lateral_right_1_5]
    arms: [smooth, zero, antismooth]
    block_ids: [545, 546, 547, 548, 549, 550]
    expected_run_count: 72
    claim_allowed: false

decision_gate:
  minimum_ordered_backend_profile_strata: 3
  no_action_rate_separation_absolute_tolerance_per_s: 1.0e-6
  safety_stop:
    any_nonfinite_or_contract_failure: true
    any_intervention_linf_violation: true
    any_smooth_arm_fall_or_base_contact: true
  pass_all_required:
    data_integrity_all_cells: true
    zero_arm_bit_exact_with_arm_B: true
    invalid_stale_all_arms_bit_exact_with_arm_B: true
    action_rate_order: smooth_below_zero_below_antismooth_in_at_least_3_of_4_backend_profile_strata
    body_rate_order_same_direction: true
    smooth_tracking_survival_direction_nonnegative_in_each_backend: true
    smooth_hazard_direction_nonpositive_in_each_backend: true
    maximum_absolute_moving_speed_difference_vs_zero_mps: 0.05
  fail_any:
    smooth_body_rate_and_tracking_survival_both_worse_in_either_backend: true
    no_realized_action_rate_separation: true
  otherwise: INCONCLUSIVE
  pass_next_step: design_action_conditioned_transition_model
  fail_next_step: stop_action_conditioned_new_C_route
  inconclusive_next_step: one_predeclared_expanded_stage_only_no_parameter_sweep

