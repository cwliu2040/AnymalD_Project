schema_version: 1
model_id: slam-component-conditioned-risk-model-v2
status: refrozen_offline_identification_fit_only
date: 2026-08-24

source:
  dataset_role: excluded_component_identification_development
  root: outputs/slam_component_identification_pilot_v1_attempt1/causal_pilot
  protocol: configs/slam_component_identification_pilot_v1.yaml
  protocol_sha256: e72b7ea61c948d609579191dcddeed6a967b43bb6e2b947f408a3e6f9860f326
  manifest_sha256: e7869119bc61c985e70d562aff902213dc1845992e4aaa12db05cfce58ab317c
  decision_sha256: 392d4fd50a26f3730b58f2e5e6f50b246944651c853cbb7f3ebf14447bad18f5
  required_decision: PASS
  expected_run_count: 96
  blocks: [577, 578, 579, 580]

target:
  name: pulse_window_intention_to_treat_failure_fraction
  horizon_s: 0.5
  experimental_unit: scheduled_live_run
  frame_samples_as_independent_replicates: false

runtime_feature_contract:
  backend_id_allowed: false
  profile_id_allowed: false
  ground_truth_allowed: false
  future_label_allowed: false
  intervention_id_allowed: false
  inputs:
    - slam_confidence_probability
    - slam_tracking_valid
    - slam_normalized_age
    - requested_command_xyz
    - base_linear_velocity_xy
    - base_angular_velocity_z
    - joint_velocity_rms
    - previous_action_rms
    - candidate_command_scales_xyz

models:
  estimator: standardized_l2_ridge_fractional_probability
  l2_penalty: 1.0
  output_clip: [0.0, 1.0]
  random_process_used: false
  family_order: [state_only, scalar_action, component_action_v2_additive_directional]
  primary_family: component_action_v2_additive_directional
  v1_terms_removed_before_v2_fit:
    - duplicate_scale_and_reduction_columns
    - action_x_confidence_interactions
    - translation_x_yaw_reduction_interaction
  comparisons:
    state_only: {candidate_action_features: false}
    scalar_action: {action_representation: mean_xyz_scale}
    component_action_v2_additive_directional:
      action_representation: separate_translation_and_yaw_reduction_plus_requested_yaw_interactions

validation:
  scheme: leave_one_block_out
  held_out_blocks: [577, 578, 579, 580]
  refit_preprocessing_inside_each_fold: true
  group_for_action_selection: [backend, profile, block]
  group_prestate: mean_of_six_pre_treatment_observations
  candidate_arms:
    - control
    - uniform_075
    - reduce_translation_075
    - reduce_translation_0875
    - reduce_yaw_075
    - reduce_yaw_0875
  tie_break: highest_mean_xyz_scale_then_protocol_order
  reserved_external_validation_blocks: [581, 582, 583, 584]

decision_gate:
  all_required:
    complete_source_integrity: true
    component_brier_not_worse_than_state_only: true
    component_brier_not_worse_than_scalar_action: true
    liosam_selected_minus_uniform_mean_hazard_maximum: -0.02
    liosam_selected_nonworse_groups_minimum: 6
    liosam_selected_minus_uniform_mean_speed_mps_minimum: -0.02
    fastlio2_selected_minus_control_mean_hazard_maximum: 0.02
    selected_component_arm_fraction_minimum: 0.25
    selected_distinct_arm_count_minimum: 2
    no_selected_arm_safety_event: true
  pass_next_step: freeze_model_artifact_and_execute_reserved_external_validation
  fail_next_step: do_not_use_reserved_validation_stop_component_model_route
  development_data_cannot_support_formal_claim: true

boundaries:
  offline_model_fit_authorized: true
  ros_policy_wiring_authorized: false
  live_execution_authorized: false
  ppo_training_authorized: false
  default_switch_authorized: false
  physical_robot_authorized: false
