schema_version: 1
model_id: slam-component-conditioned-risk-model-v1
status: frozen_offline_development_only
date: 2026-08-24

source:
  dataset_role: excluded_causal_development
  root: outputs/slam_component_pulse_causal_pilot_v1_attempt2/causal_pilot
  protocol: configs/slam_component_pulse_causal_pilot_v1.yaml
  protocol_sha256: a0646009a2cf28acab99755f0c5e23a3fde2e31fcf0e152472d67e893514c6e5
  manifest_sha256: 587c64f8d4250fb778dd439f98fcff76ce2338d99544c15ee0401c9bd5403b4b
  decision_sha256: ebd2cc10cd9ed79b0622b08ebe4a34e61462bf12779f2864f8ea3cf8456fa710
  required_decision: PASS
  expected_run_count: 64
  blocks: [572, 573, 574, 575]

target:
  name: pulse_window_intention_to_treat_failure_fraction
  horizon_s: 0.5
  experimental_unit: scheduled_live_run
  frame_samples_as_independent_replicates: false

runtime_feature_contract:
  backend_id_allowed: false
  profile_id_allowed: false
  ground_truth_allowed: false
  future_label_allowed: false
  intervention_id_allowed: false
  inputs:
    - slam_confidence_probability
    - slam_tracking_valid
    - slam_normalized_age
    - requested_command_xyz
    - base_linear_velocity_xy
    - base_angular_velocity_z
    - joint_velocity_rms
    - previous_action_rms
    - candidate_command_scales_xyz

models:
  estimator: standardized_l2_ridge_fractional_probability
  l2_penalty: 1.0
  output_clip: [0.0, 1.0]
  random_process_used: false
  comparisons:
    state_only:
      candidate_action_features: false
    scalar_action:
      action_representation: mean_xyz_scale
    component_action:
      action_representation: separate_translation_and_yaw_scales_with_state_interactions

validation:
  scheme: leave_one_block_out
  held_out_blocks: [572, 573, 574, 575]
  refit_preprocessing_inside_each_fold: true
  group_for_action_selection: [backend, profile, block]
  group_prestate: mean_of_four_pre_treatment_observations
  candidate_arms: [control, uniform_075, preserve_yaw, preserve_translation]
  tie_break: highest_mean_xyz_scale_then_protocol_order

decision_gate:
  all_required:
    complete_source_integrity: true
    component_brier_not_worse_than_state_only: true
    component_brier_not_worse_than_scalar_action: true
    liosam_selected_minus_uniform_mean_hazard_maximum: -0.05
    liosam_selected_nonworse_groups_minimum: 6
    liosam_selected_minus_uniform_mean_speed_mps_minimum: -0.02
    fastlio2_selected_minus_control_mean_hazard_maximum: 0.02
    selected_component_arm_fraction_minimum: 0.50
    selected_distinct_arm_count_minimum: 2
    no_selected_arm_safety_event: true
  pass_next_step: freeze_offline_candidate_interface_and_design_fresh_validation
  fail_next_step: do_not_wire_model_redesign_features_or_collect_fresh_identification_data
  development_data_cannot_support_formal_claim: true

boundaries:
  offline_model_fit_authorized: true
  ros_policy_wiring_authorized: false
  live_execution_authorized: false
  ppo_training_authorized: false
  default_switch_authorized: false
  physical_robot_authorized: false
