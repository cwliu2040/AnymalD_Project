schema_version: 1
candidate_id: slam-constrained-residual-c2-v1
status: retained_component_velocity_baseline_v2_model_failed_not_primary_candidate
date: 2026-08-24

implementation:
  pure_core: >-
    deployment/ros2_ws/src/anymal_locomotion_ros2/anymal_locomotion_ros2/
    constrained_residual_c2_core.py
  ros_independent: true
  evaluation_order:
    - validate_slam_and_candidate_output
    - choose_effective_command_from_original_request
    - evaluate_frozen_model1450_with_effective_command
    - add_validated_bounded_joint_residual
  policy_node_wiring_complete: false
  training_environment_wiring_complete: false

architecture:
  frozen_backbone: model1450
  initialize_from_old_c_model48: false
  valid_fresh_input_command: original_requested_command
  apply_arm_b_soft_scale_before_candidate: false
  candidate_outputs:
    command_component_scales_xyz:
      minimum: [0.20, 0.20, 0.20]
      maximum: [1.00, 1.00, 1.00]
      uniform_scaling_required: false
    bounded_joint_action_residual_linf: 0.10
  healthy_behavior:
    command_component_scales_xyz: [1.0, 1.0, 1.0]
    joint_action_residual: exact_zero
  fallback:
    risk_input_missing_or_invalid: exact_arm_b_soft_behavior
    slam_invalid_or_stale: exact_zero_hard_stop
  runtime_ground_truth_input: false
  runtime_future_label_input: false

reward_contract:
  reuse_existing_locomotion_reward_stack: true
  source_config: >-
    source/anymal_locomotion/anymal_locomotion/tasks/manager_based/locomotion/
    velocity/config/anymal_d/flat_env_cfg.py::AnymalDLocomotionRobustRewardsCfg
  duplicate_velocity_reward_allowed: false
  velocity_tracking_target: original_requested_command
  forbidden_velocity_tracking_terms:
    - confidence_track_lin_vel_xy_exp
    - confidence_track_ang_vel_z_exp
  retained_terms:
    - requested_command_linear_velocity_tracking
    - requested_command_yaw_rate_tracking
    - feet_slide
    - body_motion
    - action_rate
    - torque_and_energy
    - fall_and_termination
  new_terms_only:
    future_slam_advantage_vs_arm_b:
      horizon_s: 0.5
      enabled_only_if_short_pulse_headroom_passes: true
      raw_future_confidence_reward_forbidden: true
    unnecessary_command_reduction:
      active_only_while_slam_valid_and_fresh: true
    healthy_backbone_deviation:
      target: exact_model1450
    invalid_hard_stop:
      progress_penalty_masked: true

optimization:
  method: constrained_residual_ppo
  primary_objective: maximize_existing_locomotion_return
  constraints:
    future_slam_risk_not_worse_than_arm_b: true
    valid_degraded_progress_ratio_vs_arm_b_minimum: 1.05
    stopped_fraction_excess_vs_arm_b_maximum: 0.00
    healthy_action_linf_vs_model1450_maximum: 0.02
    safety_events_excess_vs_arm_b_maximum: 0
  ppo_training_authorized: false

ceiling_aware_evaluation:
  fastlio2:
    role: noninferiority_or_ceiling_safeguard
    superiority_required: false
    risk_difference_candidate_minus_b_maximum: 0.01
    progress_ratio_candidate_over_b_minimum: 0.98
  liosam:
    role: prespecified_improvement_backend
    minimum_improved_degraded_strata: 1
    risk_difference_candidate_minus_b_maximum: 0.00
    progress_ratio_candidate_over_b_minimum: 1.05
  backends_reported_separately: true
  pooled_backend_rescue_forbidden: true

anti_collapse:
  evaluated_only_in_prespecified_liosam_degraded_strata: true
  action_linf_equivalence_tolerance: 0.02
  maximum_equivalence_fraction_vs_arm_b: 0.80
  maximum_equivalence_fraction_vs_old_c: 0.80
  consecutive_evaluations_before_stop: 3
  collapsed_status: COLLAPSED_TO_B_OR_OLD_C
  reward_for_difference_alone_forbidden: true

gates:
  c2_pure_core_complete: true
  short_pulse_headroom_passed: true
  component_specific_headroom_passed: true
  richer_component_identification_passed: true
  offline_component_risk_model_attempted: true
  offline_component_risk_model_v2_attempted: true
  offline_component_risk_model_blockwise_gate_passed: false
  reserved_external_validation_executed: false
  action_conditioned_risk_signal_available: false
  training_environment_wiring_complete: false
  ppo_training_authorized: false
  physical_robot_authorized: false
successor:
  candidate: slam-localization-aware-motor-adaptation-c3-v1
  role_of_c2: anisotropic_velocity_limiter_baseline_only
  command_preserving_low_level_headroom_proven: false
