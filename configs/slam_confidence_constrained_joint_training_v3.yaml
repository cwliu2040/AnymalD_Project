schema_version: 1
protocol_id: slam-confidence-constrained-joint-training-v3
status: iteration50_near_pass_but_strict_continuation_closed
date: 2026-08-27

purpose: >-
  Directly train the complete confidence-conditioned locomotion actor while making unsafe drift
  from matched-command model1450 structurally impossible beyond a 0.05 action deviation.

comparators:
  J1: neutral_[1,1,0]_localization_history
  J2: causal_confidence_validity_age_history
  reward_and_training_budget_identical: true

policy_constraint:
  reference: frozen_model1450_same_original_command
  complete_actor_trainable: true
  deterministic_action: reference_plus_0.05_times_tanh_of_normalized_actor_deviation
  deterministic_action_deviation_linf_limit: 0.05
  applied_at_rollout_distribution_mean: true
  applied_at_inference: true
  command_scaling: false
  inherited_behavior_anchor_coefficient: 0.25
  old_iteration50_checkpoints_allowed_as_initialization: false

reward_contract:
  source: causal_joint_training_v2
  exact_original_linear_and_yaw_command: true
  shared_between_J1_and_J2: true
  terms:
    - original_recovery_v0.5_locomotion_and_safety
    - causal_delayed_localization_advantage
    - angular_acceleration
    - linear_jerk
    - lidar_scan_translation_motion
    - lidar_scan_rotation_motion
  actual_backend_efficacy_claim_from_proxy_forbidden: true

initialization_and_anchoring:
  source_checkpoint: checkpoints/anymal_d_locomotion_v1/recovery_v0.4.0/model_1450.pt
  source_actor_input_dimension: 48
  target_actor_input_dimension: 1068
  behavior_reference: frozen_model1450_actor

training_budget:
  execution_authorized: false
  arms: [J1, J2]
  independent_training_seeds: [1450]
  num_environments_per_seed: 4096
  rollout_steps_per_environment: 24
  maximum_iterations_per_seed: 300
  current_authorized_iterations_per_arm: 50
  common_interim_safety_audit_iteration: 50
  continuation_to_300_requires_all_profile_safety_pass: true

training_execution:
  completed: true
  stage: iteration_50
  checkpoint_root: logs/rsl_rl/anymal_d_locomotion_constrained_joint_training_v3
  checkpoint_name: model_49.pt
  runs:
    - arm: J1
      seed: 1450
      run: 2026-08-27_15-51-16_J1_constrained_neutral_localization
      checkpoint_sha256: 880a0152953f135983b047a5a11c88fdaf5633af4ca76eca683e4da28a1d25f1
      finite: true
    - arm: J2
      seed: 1450
      run: 2026-08-27_15-52-30_J2_constrained_localization_history
      checkpoint_sha256: 37a03ad7dda13e61556e38fe031729029ef32bee42608807a1103f0a8eb98547
      finite: true

