schema_version: 1
repetitions: 3

loop_search:
  radius_m: 1.5
  minimum_time_difference_s: 8.0
  neighboring_keyframes: 25
  maximum_icp_fitness_score: 0.3

profiles:
  - name: loop_out_and_back
    enabled_expectation: required
  - name: loop_back_and_forth
    enabled_expectation: required
  - name: loop_open_forward
    enabled_expectation: forbidden
  - name: loop_open_backward
    enabled_expectation: forbidden
