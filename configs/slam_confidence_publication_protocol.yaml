schema_version: 1
protocol_id: slam-confidence-publication-v1
status: preregistered_not_ready_for_collection
date: 2026-08-17
formal_collection_authorized: false

scope:
  claim: confidence_conditioned_learned_gait_adaptation_with_safety_structure
  causal_chain:
    - confidence_decreases
    - gait_changes
    - body_motion_and_foot_slip_decrease
    - slam_tracking_survival_increases
    - task_efficiency_is_retained
  replay_is_closed_loop_evidence: false
  promotion_decision_in_scope: false

frozen_artifacts:
  formal_model1450:
    policy: exported/anymal_d_locomotion_v1/recovery_v0.4.0/policy.onnx
    policy_sha256: 721a918533cd00e605cf6edfcd8bf8bba9cbd56f26e22c2eda26604f03ee54c0
