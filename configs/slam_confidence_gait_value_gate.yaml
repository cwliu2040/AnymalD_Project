schema_version: 1
gate_id: slam-confidence-gait-value-v1

# This gate asks whether a 51-D policy adds a gait adaptation benefit beyond
# applying exactly the same confidence-derived command limiter to model1450.
required_windows:
  - healthy
  - degraded_late
  - invalid_settled
  - recovery_settled

gait_metrics:
  - action_rate_rms
  - body_tilt_rms
  - body_roll_pitch_rate_rms_radps
  - mean_absolute_vertical_speed_mps
  - mean_stance_foot_slip_speed_mps

thresholds:
  hard_terminated_env_fraction_max: 0.01
  healthy_linear_rmse_regression_max_mps: 0.10
  recovery_linear_rmse_regression_max_mps: 0.10
  healthy_each_gait_ratio_max: 1.10
  recovery_each_gait_ratio_max: 1.10
  degraded_invalid_each_gait_ratio_max: 1.10
  degraded_invalid_gait_composite_ratio_max: 0.95
