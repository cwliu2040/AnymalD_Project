schema_version: 1
protocol_id: slam-confidence-causal-calibration-v1
status: retrospective_actual_backend_calibration_failed_execution_closed
date: 2026-08-27
dataset_role: calibration_feasibility_not_policy_efficacy

question: >-
  Under exact original commands and matched realized speed, does realized body/LiDAR scan motion
  have a non-negative action-dependent relationship with future SLAM usability that transfers to
  an unseen route for FAST-LIO2 and LIO-SAM separately?

source:
  root: outputs/slam_low_level_touchdown_headroom_v1/pilot
  run_manifest: outputs/slam_low_level_touchdown_headroom_v1/pilot/run_manifest.json
  run_manifest_sha256: 6c4648aa3bc88728c76139ccf423caaf24176d586a4f3fadcaa959545717efe5
  matrix_summary: outputs/slam_low_level_touchdown_headroom_v1/pilot/matrix_summary.json
  matrix_summary_sha256: 1db6b0807e17e3c4f76ff85789b8f3f1ea40a73575b7baeb5d3c06a8f61c2a26
  source_protocol: configs/slam_low_level_touchdown_headroom_v1.yaml
  source_protocol_sha256: b00cc0f088d4d9fe0327c1a06ca8261bd36d46831ee5a99c7dcbbbd2709c0e86
  source_release: configs/slam_low_level_touchdown_pilot_release_v1.yaml
  source_release_sha256: 30d2ff8ea94fbb62f64d7c583b51c1c0d3e2733d1489c01b758d8d8c157eee75
  expected_run_count: 72
  actual_backends_required: [fastlio2, liosam]
  model1450_original_command_required: true
  synthetic_confidence_outcome_forbidden: true
  ground_truth_or_future_label_actor_input: false

split:
  calibration_routes: [lateral_translation_bounded, pure_yaw_bounded]
  held_out_routes: [mixed_curve_bounded]
  blocks: [598, 599, 600, 601]
  arms: [zero, touchdown_soft_low, touchdown_soft]
  comparator_arm: zero
  unit: candidate_minus_zero_within_backend_profile_block
  backend_pooling_forbidden: true

motion_proxy:
  lidar_scan_time_s: 0.10
  translation: rms_norm_of_half_body_linear_acceleration_times_scan_time_squared
  rotation: frozen_lidar_scan_time_rotation_rad_from_run_record
  fitted_features: [delta_translation_squared, delta_rotation_squared]
  nonnegative_coefficients_required: true
  intercept: 0.0
  rationale: zero_motion_difference_must_predict_zero_action_effect

outcome:
  primary: delta_valid_requested_usable_next_horizon_failure_fraction
  secondary: delta_tracking_restricted_mean_survival_time_s
  actual_backend_labels_only: true

eligibility:
  exact_command_required: true
  run_integrity_required: true
  fall_or_base_contact_forbidden: true
  maximum_absolute_moving_linear_speed_difference_mps: 0.05
  maximum_absolute_realized_yaw_rate_difference_radps: 0.05
  minimum_calibration_contrasts_per_backend: 12
  minimum_held_out_contrasts_per_backend: 6

success_gate:
  both_backends_must_pass_separately: true
  minimum_relative_held_out_mse_improvement_over_zero_effect: 0.05
  minimum_nonzero_target_sign_accuracy: 0.625
  minimum_positive_motion_coefficients: 1
  proxy_parameters_may_be_frozen_only_on_pass: true
  failure_disposition: >-
    Do not collect fresh repetitions of the same excitation family and do not start PPO; redesign
    the localization transition target or add a measured scene/support latent before new execution.

execution:
  retrospective_analysis_authorized: false
  fresh_simulation_collection_authorized: false
  ppo_training_authorized: false
  teacher_student_authorized: false
  live_deployment_authorized: false
  physical_robot_authorized: false
  output: outputs/slam_confidence_causal_joint_training_v2/calibration_v1/summary.json
  result:
    decision: CALIBRATION_FAIL
    artifact_sha256: 6c7869db41b214aa90b20b61dd5780ebacbccf64028ddbac1ea1b04426fa8370
    executed_protocol_snapshot: outputs/slam_confidence_causal_joint_training_v2/calibration_v1/protocol_executed.yaml
    executed_protocol_sha256: 947a4d9c6ecf0c3a912bb6d09ac37d60ed0212a2a61a25abfcce94fba54dd721
    run_count: 72
    contrast_count: 48
    eligible_contrast_count: 48
    fastlio2:
