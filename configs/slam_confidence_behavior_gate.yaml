schema_version: 1
profile_id: slam-confidence-v2-forward-stop-recover

# Fixed across iteration-0 and trained-candidate evaluations.
seed: 43
num_envs: 512
steps: 1000
cycle_s: 10.0
command:
  vx: 1.5
  vy: 0.0
  wz: 0.0

# Windows intentionally omit transition boundaries and measure settled behavior.
windows:
  healthy:
    phase: [0.10, 0.30]
  degraded_late:
    phase: [0.45, 0.50]
  invalid_settled:
    phase: [0.60, 0.70]
  recovery_settled:
    phase: [0.90, 1.00]

gates:
  healthy_linear_rmse_max_mps: 0.45
  healthy_mean_planar_speed_min_mps: 1.10
  degraded_speed_ratio_to_healthy_max: 0.65
  degraded_linear_rmse_max_mps: 0.50
  invalid_mean_planar_speed_max_mps: 0.25
  invalid_speed_above_0_50_fraction_max: 0.05
  invalid_mean_abs_yaw_rate_max_radps: 0.20
  recovery_linear_rmse_max_mps: 0.45
  recovery_mean_planar_speed_min_mps: 1.00
  hard_termination_fraction_max: 0.01
